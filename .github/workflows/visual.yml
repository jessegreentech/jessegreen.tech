name: Visual checks

# The baseline job creates missing screenshot baselines on same-repository pull
# requests and commits them to the branch for the owner to review in the diff.
# Advisory. Never required to merge.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash tools/setup-visual.sh
      - run: npm run visual
      - run: npm run visual:evidence
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-output
          path: visual/output/
          if-no-files-found: ignore

  baseline:
    name: Create missing baselines
    # Writes to the pull request branch, so only for pull requests from this
    # repository. Forks and Dependabot get no write token and never reach it.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    continue-on-error: true
    concurrency:
      group: visual-baseline-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash tools/setup-visual.sh
      - id: baseline
        run: bash tools/ci-baseline.sh
      - if: steps.baseline.outputs.added == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr comment "$PR_URL" --body-file visual/output/baseline-comment.md
