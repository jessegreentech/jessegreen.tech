name: Visual checks

# Advisory. Never required to merge.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash tools/setup-visual.sh
      - run: npm run visual
      - run: npm run visual:evidence
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-output
          path: visual/output/
          if-no-files-found: ignore
